<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <radialGradient id="apiGlow" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0b0f17" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" rx="16" fill="#0b0f17" stroke="#1e293b" stroke-width="1"/>
  <rect width="800" height="500" rx="16" fill="url(#apiGlow)"/>

  <!-- Chrome Header -->
  <rect width="800" height="42" rx="16" fill="#111827"/>
  <rect y="24" width="800" height="18" fill="#111827"/>
  <circle cx="24" cy="21" r="5" fill="#ef4444"/>
  <circle cx="42" cy="21" r="5" fill="#f59e0b"/>
  <circle cx="60" cy="21" r="5" fill="#10b981"/>
  <text x="400" y="26" text-anchor="middle" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="12">api.gateway.spec.json · 85ms P95</text>

  <!-- Gateway Topology Diagram -->
  <g transform="translate(60, 80)">
    <!-- Client -->
    <rect x="0" y="40" width="130" height="70" rx="10" fill="#141c2c" stroke="#1e293b" stroke-width="1"/>
    <text x="65" y="72" text-anchor="middle" fill="#f8fafc" font-family="'Outfit', sans-serif" font-size="14" font-weight="600">Client Apps</text>
    <text x="65" y="92" text-anchor="middle" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="10">Web &amp; Mobile</text>

    <!-- Arrow -->
    <path d="M140 75 L180 75" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="160" y="66" text-anchor="middle" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="10">HTTPS</text>

    <!-- Ingress / Zod Validator -->
    <rect x="190" y="20" width="160" height="110" rx="10" fill="#141c2c" stroke="#10b981" stroke-width="1.5"/>
    <text x="270" y="52" text-anchor="middle" fill="#10b981" font-family="'Outfit', sans-serif" font-size="14" font-weight="600">Validation Layer</text>
    <text x="270" y="74" text-anchor="middle" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="11">Zod Schemas</text>
    <text x="270" y="94" text-anchor="middle" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="10">Payload Sanitization</text>
    <text x="270" y="112" text-anchor="middle" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="10">100% Type-Safe</text>

    <!-- Arrow -->
    <path d="M360 75 L400 75" stroke="#334155" stroke-width="2"/>

    <!-- RBAC Guard -->
    <rect x="410" y="20" width="160" height="110" rx="10" fill="#141c2c" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="490" y="52" text-anchor="middle" fill="#38bdf8" font-family="'Outfit', sans-serif" font-size="14" font-weight="600">RBAC Guard</text>
    <text x="490" y="74" text-anchor="middle" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="11">JWT Verification</text>
    <text x="490" y="94" text-anchor="middle" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="10">Role Bitmask Checks</text>
    <text x="490" y="112" text-anchor="middle" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="10">Zero Escalation</text>

    <!-- Arrow -->
    <path d="M580 75 L620 75" stroke="#334155" stroke-width="2"/>

    <!-- DB Layer -->
    <rect x="630" y="40" width="130" height="70" rx="10" fill="#141c2c" stroke="#1e293b" stroke-width="1"/>
    <text x="695" y="72" text-anchor="middle" fill="#f8fafc" font-family="'Outfit', sans-serif" font-size="14" font-weight="600">PostgreSQL</text>
    <text x="695" y="92" text-anchor="middle" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="10">Drizzle ORM</text>
  </g>

  <!-- Endpoint Specifications Grid -->
  <g transform="translate(60, 240)">
    <rect width="680" height="210" rx="12" fill="#0d131f" stroke="#1e293b" stroke-width="1"/>
    <text x="24" y="32" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="12">CORE SERVICE ENDPOINTS SPECIFICATION</text>

    <!-- Row 1 -->
    <rect x="24" y="50" width="60" height="26" rx="4" fill="#047857"/>
    <text x="54" y="67" text-anchor="middle" fill="#ecfdf5" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold">POST</text>
    <text x="96" y="67" fill="#f8fafc" font-family="'JetBrains Mono', monospace" font-size="13">/api/v1/auth/login</text>
    <text x="450" y="67" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="11">Issue JWT &amp; Role Bitmask</text>
    <text x="620" y="67" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="11">18ms</text>

    <!-- Row 2 -->
    <rect x="24" y="88" width="60" height="26" rx="4" fill="#1d4ed8"/>
    <text x="54" y="105" text-anchor="middle" fill="#eff6ff" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold">GET</text>
    <text x="96" y="105" fill="#f8fafc" font-family="'JetBrains Mono', monospace" font-size="13">/api/v1/vehicles/inventory</text>
    <text x="450" y="105" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="11">Paginated Query + Filter</text>
    <text x="620" y="105" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="11">34ms</text>

    <!-- Row 3 -->
    <rect x="24" y="126" width="60" height="26" rx="4" fill="#047857"/>
    <text x="54" y="143" text-anchor="middle" fill="#ecfdf5" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold">POST</text>
    <text x="96" y="143" fill="#f8fafc" font-family="'JetBrains Mono', monospace" font-size="13">/api/v1/bookings/reserve</text>
    <text x="450" y="143" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="11">RBAC Guarded + ACID Tx</text>
    <text x="620" y="143" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="11">52ms</text>

    <!-- Row 4 -->
    <rect x="24" y="164" width="60" height="26" rx="4" fill="#b45309"/>
    <text x="54" y="181" text-anchor="middle" fill="#fffbeb" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold">PATCH</text>
    <text x="96" y="181" fill="#f8fafc" font-family="'JetBrains Mono', monospace" font-size="13">/api/v1/bookings/:id/status</text>
    <text x="450" y="181" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="11">Finite State Machine Guard</text>
    <text x="620" y="181" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="11">29ms</text>
  </g>
</svg>