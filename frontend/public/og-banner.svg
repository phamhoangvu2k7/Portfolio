<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <radialGradient id="ogGlow" cx="20%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.18"/>
      <stop offset="50%" stop-color="#06b6d4" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#070a10" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ogCardGlow" cx="50%" cy="0%" r="80%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#121824" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Deep Obsidian Slate Canvas -->
  <rect width="1200" height="630" fill="#070a10"/>
  
  <!-- Subtle Ambient Glow -->
  <rect width="1200" height="630" fill="url(#ogGlow)"/>

  <!-- Subtle Blueprint Edge Lines -->
  <line x1="80" y1="80" x2="1120" y2="80" stroke="#1e293b" stroke-width="1" stroke-dasharray="8 8"/>
  <line x1="80" y1="550" x2="1120" y2="550" stroke="#1e293b" stroke-width="1" stroke-dasharray="8 8"/>

  <!-- Status Pill -->
  <g transform="translate(100, 110)">
    <rect width="360" height="38" rx="19" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <circle cx="22" cy="19" r="5" fill="#10b981"/>
    <text x="38" y="24" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="600" letter-spacing="0.5">OPEN FOR BACKEND / FULL-STACK ROLES</text>
  </g>

  <!-- Main Headline -->
  <text x="100" y="215" fill="#f8fafc" font-family="'Outfit', -apple-system, sans-serif" font-size="58" font-weight="700" letter-spacing="-1.5">
    Pham Hoang Vu
  </text>

  <!-- Secondary Title -->
  <text x="100" y="275" fill="#10b981" font-family="'Outfit', -apple-system, sans-serif" font-size="34" font-weight="600" letter-spacing="-0.5">
    Backend &amp; Full-Stack Systems Engineer
  </text>

  <!-- Subtitle Description -->
  <text x="100" y="335" fill="#94a3b8" font-family="'Outfit', -apple-system, sans-serif" font-size="22" font-weight="400">
    Architecting high-throughput RESTful APIs, edge-native microservices,
  </text>
  <text x="100" y="370" fill="#94a3b8" font-family="'Outfit', -apple-system, sans-serif" font-size="22" font-weight="400">
    and type-safe full-stack platforms with Node.js, TypeScript &amp; Cloudflare D1.
  </text>

  <!-- Tech Stack Chips -->
  <g transform="translate(100, 430)">
    <rect x="0" y="0" width="120" height="40" rx="8" fill="#111827" stroke="#1f2937" stroke-width="1"/>
    <text x="60" y="25" text-anchor="middle" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="500">Node.js</text>

    <rect x="135" y="0" width="135" height="40" rx="8" fill="#111827" stroke="#1f2937" stroke-width="1"/>
    <text x="202" y="25" text-anchor="middle" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="500">TypeScript</text>

    <rect x="285" y="0" width="140" height="40" rx="8" fill="#111827" stroke="#1f2937" stroke-width="1"/>
    <text x="355" y="25" text-anchor="middle" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="500">PostgreSQL</text>

    <rect x="440" y="0" width="140" height="40" rx="8" fill="#111827" stroke="#1f2937" stroke-width="1"/>
    <text x="510" y="25" text-anchor="middle" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="500">Cloudflare D1</text>

    <rect x="595" y="0" width="130" height="40" rx="8" fill="#111827" stroke="#1f2937" stroke-width="1"/>
    <text x="660" y="25" text-anchor="middle" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="500">Drizzle ORM</text>

    <rect x="740" y="0" width="110" height="40" rx="8" fill="#111827" stroke="#1f2937" stroke-width="1"/>
    <text x="795" y="25" text-anchor="middle" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="500">Docker</text>
  </g>

  <!-- Right Visual Workbench Card -->
  <g transform="translate(870, 110)">
    <rect width="230" height="360" rx="16" fill="#0d131f" stroke="#1e293b" stroke-width="1"/>
    <rect width="230" height="360" rx="16" fill="url(#ogCardGlow)"/>

    <!-- Terminal Bar -->
    <rect width="230" height="36" rx="16" fill="#141c2c"/>
    <rect y="20" width="230" height="16" fill="#141c2c"/>
    <circle cx="20" cy="18" r="4.5" fill="#ef4444"/>
    <circle cx="36" cy="18" r="4.5" fill="#f59e0b"/>
    <circle cx="52" cy="18" r="4.5" fill="#10b981"/>
    <text x="135" y="22" text-anchor="middle" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="11">system.config</text>

    <!-- Code Snippet -->
    <text x="20" y="70" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="12">const</text>
    <text x="65" y="70" fill="#f8fafc" font-family="'JetBrains Mono', monospace" font-size="12">engineer = {</text>
    <text x="32" y="98" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="12">name:</text>
    <text x="78" y="98" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="12">'Vu Pham',</text>
    <text x="32" y="126" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="12">focus:</text>
    <text x="86" y="126" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="12">'High-QPS APIs',</text>
    <text x="32" y="154" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="12">latency:</text>
    <text x="96" y="154" fill="#f59e0b" font-family="'JetBrains Mono', monospace" font-size="12">'&lt; 85ms',</text>
    <text x="32" y="182" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="12">status:</text>
    <text x="90" y="182" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="12">'Available',</text>
    <text x="32" y="210" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="12">location:</text>
    <text x="105" y="210" fill="#a78bfa" font-family="'JetBrains Mono', monospace" font-size="12">'Da Nang, VN'</text>
    <text x="20" y="238" fill="#f8fafc" font-family="'JetBrains Mono', monospace" font-size="12">};</text>

    <line x1="20" y1="265" x2="210" y2="265" stroke="#1e293b" stroke-width="1"/>
    
    <text x="20" y="295" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="11">✓ RBAC Guard: Active</text>
    <text x="20" y="320" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="11">✓ Schema Type: Safe</text>
    <text x="20" y="345" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="11">● 60 FPS UI Verified</text>
  </g>

  <!-- Bottom Details -->
  <text x="100" y="525" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="14">
    DUT · Danang University of Technology &nbsp;|&nbsp; Da Nang, Vietnam (UTC+7)
  </text>
</svg>